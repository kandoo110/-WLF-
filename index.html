<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>WLF Coin - Tap to Earn</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #1a1d24;
            --accent-color: #f3ba2f;
            --accent-hover: #ffca3a;
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-container {
            text-align: center;
            margin-top: 15px;
        }

        .score-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 42px;
            font-weight: 800;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.3);
        }

        .coin-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            cursor: pointer;
        }

        .coin {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 30% 30%, #ffe066, #f3ba2f 60%, #b8860b);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(243, 186, 47, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.6);
            border: 6px solid #ffd700;
            transition: transform 0.05s ease;
        }

        .coin:active {
            transform: scale(0.95);
        }

        .coin-symbol {
            font-size: 32px;
            font-weight: 900;
            color: #1a1d24;
        }

        .coin-subtext {
            font-size: 12px;
            color: #4a3b00;
            font-weight: bold;
        }

        .floating-text {
            position: absolute;
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-color);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        .energy-container {
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
        }

        .energy-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .energy-bar-outer {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .energy-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f3ba2f, #2ed573);
            border-radius: 6px;
            transition: width 0.2s ease;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #000;
            border: none;
        }

        #ton-connect-button {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="userAvatar">U</div>
            <div>
                <div style="font-weight: bold; font-size: 14px;" id="userName">کاربر</div>
                <div style="font-size: 11px; color: var(--text-sub);">شبکه TON</div>
            </div>
        </div>
        <!-- دکمه اتصال ولت -->
        <div id="ton-connect-button"></div>
    </div>

    <div class="score-container">
        <div class="score-title">موجودی $WLF شما</div>
        <div class="score-value">
            <span id="score">0</span>
            <span style="font-size: 20px;">$WLF</span>
        </div>
    </div>

    <div class="coin-container" id="coinContainer">
        <div class="coin" id="coin">
            <div class="coin-symbol">$WLF</div>
            <div class="coin-subtext">کلیک کنید</div>
        </div>
    </div>

    <div class="energy-container">
        <div class="energy-header">
            <span>⚡ انرژی باقی‌مانده</span>
            <span><strong id="energy">1000</strong> / 1000</span>
        </div>
        <div class="energy-bar-outer">
            <div class="energy-bar-inner" id="energyBar"></div>
        </div>
    </div>

    <div class="action-grid">
        <button class="btn btn-primary" onclick="openClaimModal()">
            🎁 درخواست برداشت (حداقل ۱۰,۰۰۰ توکن)
        </button>
    </div>

    <script>
        // Initialize TON Connect UI safely
        let tonConnectUI;
        try {
            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://kandoo110.github.io/wlf-game/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });
        } catch (e) {
            console.error("TON Connect Init Error:", e);
        }

        // Init Telegram SDK
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
                document.getElementById('userAvatar').innerText = tg.initDataUnsafe.user.first_name[0];
            }
        }

        // Game State Variables (Using LocalStorage with fallback)
        let score = parseInt(localStorage.getItem('wlf_score')) || 0;
        let energy = parseInt(localStorage.getItem('wlf_energy')) || 1000;
        const maxEnergy = 1000;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const energyBar = document.getElementById('energyBar');
        const coinContainer = document.getElementById('coinContainer');

        scoreEl.innerText = score.toLocaleString();
        updateEnergyUI();

        function saveProgress() {
            try {
                localStorage.setItem('wlf_score', score);
                localStorage.setItem('wlf_energy', energy);
            } catch(e){}
        }

        // Tap Event Handler
        function handleTap(e) {
            e.preventDefault();
            if (energy <= 0) return;

            score += 1;
            energy -= 1;
            saveProgress();

            scoreEl.innerText = score.toLocaleString();
            updateEnergyUI();

            let clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : window.innerWidth/2);
            let clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : window.innerHeight/2);

            createFloatingText(clientX, clientY);

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        coinContainer.addEventListener('touchstart', handleTap, {passive: false});
        coinContainer.addEventListener('mousedown', (e) => {
            if (!('ontouchstart' in window)) handleTap(e);
        });

        function createFloatingText(x, y) {
            const rect = coinContainer.getBoundingClientRect();
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = '+1';
            text.style.left = `${x - rect.left - 15}px`;
            text.style.top = `${y - rect.top - 30}px`;
            coinContainer.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        function updateEnergyUI() {
            energyEl.innerText = energy;
            const percentage = (energy / maxEnergy) * 100;
            energyBar.style.width = `${percentage}%`;
        }

        // Energy Regeneration
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                saveProgress();
                updateEnergyUI();
            }
        }, 1500);

        // Claim Function
        function openClaimModal() {
            let userAddress = "";
            try {
                if (tonConnectUI && tonConnectUI.wallet) {
                    userAddress = tonConnectUI.wallet.account.address;
                }
            } catch(e){}

            if (!userAddress) {
                alert('لطفاً ابتدا از طریق دکمه بالای صفحه، کیف پول Tonkeeper خود را متصل کنید.');
                if (tonConnectUI) tonConnectUI.openModal();
                return;
            }

            if (score < 10000) {
                alert('حداقل میزان موجودی برای برداشت ۱۰,۰۰۰ توکن $WLF است.');
                return;
            }

            alert(`درخواست برداشت ${score} توکن $WLF با موفقیت ثبت شد!\nآدرس متصل‌شده:\n${userAddress}`);
        }
    </script>
</body>
</html>
