<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WLF Tap-to-Earn Game</title>

  <!-- Telegram Web App SDK & TON Connect -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent-gold: #f3ba2f;
      --accent-gold-hover: #ffd056;
      --text-main: #ffffff;
      --text-sub: #9e9e9e;
      --border-color: #2b313a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-gold), #8a6400);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .username {
      font-size: 15px;
      font-weight: 600;
    }

    /* Balance Section */
    .balance-container {
      text-align: center;
      margin: 10px 0;
    }

    .balance-label {
      font-size: 13px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-val {
      font-size: 38px;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Tap Coin Container */
    .tap-area {
      position: relative;
      margin: 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .coin-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #f3ba2f 0%, #a87d0e 70%, #4a3500 100%);
      border: 8px solid #f3ba2f;
      box-shadow: 0 0 30px rgba(243, 186, 47, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.05s ease;
      position: relative;
      outline: none;
    }

    .coin-btn:active {
      transform: scale(0.95);
    }

    .coin-logo {
      font-size: 42px;
      font-weight: 900;
      color: #0d0f12;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.3);
    }

    .coin-sub {
      font-size: 11px;
      font-weight: bold;
      color: #0d0f12;
      letter-spacing: 1px;
    }

    /* Floating Score */
    .floating-text {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      color: var(--accent-gold);
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-70px); }
    }

    /* Energy Bar */
    .energy-container {
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
    }

    .energy-stats {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .energy-bar-bg {
      width: 100%;
      height: 12px;
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .energy-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f3ba2f, #ff8c00);
      border-radius: 6px;
      transition: width 0.2s ease;
    }

    /* Action Buttons & Withdrawal */
    .actions {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-claim {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent-gold), #d49b00);
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(243, 186, 47, 0.2);
    }

    /* Withdrawal Modal (راهنمای واریز و اتصال دستی) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      text-align: center;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 12px;
    }

    .modal-text {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 16px;
      text-align: right;
      direction: rtl;
    }

    .wallet-box {
      background: #0d0f12;
      border: 1px dashed var(--accent-gold);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      color: #fff;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .btn-copy-wallet {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-gold);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-close {
      background: #2b313a;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="user-info">
      <div class="avatar" id="userAvatar">W</div>
      <div class="username" id="userName">Player</div>
    </div>
    <!-- دکمه اتصال TON Connect -->
    <div id="ton-connect-button"></div>
  </div>

  <!-- Balance -->
  <div class="balance-container">
    <div class="balance-label">Your $WLF Balance</div>
    <div class="balance-val"><i class="fa-solid fa-coins"></i> <span id="balance">0</span></div>
  </div>

  <!-- Coin Tap Area -->
  <div class="tap-area">
    <button class="coin-btn" id="tapBtn">
      <div class="coin-logo">$WLF</div>
      <div class="coin-sub">TAP TO MINE</div>
    </button>
  </div>

  <!-- Energy Bar -->
  <div class="energy-container">
    <div class="energy-stats">
      <span><i class="fa-solid fa-bolt" style="color: var(--accent-gold);"></i> Energy</span>
      <span><span id="energy">3000</span> / 3000</span>
    </div>
    <div class="energy-bar-bg">
      <div class="energy-bar-fill" id="energyFill"></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-claim" id="claimBtn"><i class="fa-solid fa-wallet"></i> Claim Tokens (Min 10,000 $WLF)</button>
  </div>

  <!-- Modal راهنمای اتصال، برداشت و واریز دستی -->
  <div class="modal-overlay" id="claimModal">
    <div class="modal-content">
      <div class="modal-title">راهنمای برداشت توکن</div>
      <div class="modal-text">
        جهت نهایی‌سازی و انتقال توکن‌های <b>$WLF</b> به کیف پول شما، لطفا مقدار <b>0.03 TON</b> بابت کارمزد شبکه به آدرس زیر واریز کنید.<br><br>
        ⚠️ <b>مهم:</b> آدرس ولت خود را در بخش <b>Comment/Memo</b> هنگام ارسال قید کنید.
      </div>
      <div class="wallet-box" id="projectWallet">EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0</div>
      <button class="btn-copy-wallet" id="copyWalletBtn"><i class="fa-regular fa-copy"></i> کپی آدرس ولت</button>
      <button class="btn-close" id="closeModalBtn">بستن</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // بازیابی استاندارد موجودی از حافظه دستگاه
    let balance = parseInt(localStorage.getItem('wlf_balance') || '0', 10);
    let energy = parseInt(localStorage.getItem('wlf_energy') || '3000', 10);
    const maxEnergy = 3000;
    const tapValue = 3;
    const energyRegenRate = 5;

    const balanceEl = document.getElementById('balance');
    const energyEl = document.getElementById('energy');
    const energyFillEl = document.getElementById('energyFill');
    const tapBtn = document.getElementById('tapBtn');
    const claimBtn = document.getElementById('claimBtn');
    const claimModal = document.getElementById('claimModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const copyWalletBtn = document.getElementById('copyWalletBtn');

    function updateUI() {
      balanceEl.textContent = balance.toLocaleString();
      energyEl.textContent = energy;
      energyFillEl.style.width = `${(energy / maxEnergy) * 100}%`;
      
      localStorage.setItem('wlf_balance', balance.toString());
      localStorage.setItem('wlf_energy', energy.toString());
    }

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      document.getElementById('userName').textContent = u.first_name || 'Player';
      if (u.first_name) {
        document.getElementById('userAvatar').textContent = u.first_name.charAt(0).toUpperCase();
      }
    }

    tapBtn.addEventListener('click', (e) => {
      if (energy >= tapValue) {
        balance += tapValue;
        energy -= tapValue;
        updateUI();

        const rect = tapBtn.getBoundingClientRect();
        const floating = document.createElement('div');
        floating.className = 'floating-text';
        floating.textContent = `+${tapValue}`;
        floating.style.left = `${e.clientX || (rect.left + rect.width / 2)}px`;
        floating.style.top = `${e.clientY || (rect.top + rect.height / 2)}px`;
        document.body.appendChild(floating);

        setTimeout(() => floating.remove(), 800);
      }
    });

    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + energyRegenRate);
        updateUI();
      }
    }, 1000);

    // باز کردن راهنمای برداشت
    claimBtn.addEventListener('click', () => {
      if (balance >= 10000) {
        claimModal.style.display = 'flex';
      } else {
        alert('حداقل میزان برداشت ۱۰,۰۰۰ توکن $WLF است.');
      }
    });

    closeModalBtn.addEventListener('click', () => {
      claimModal.style.display = 'none';
    });

    copyWalletBtn.addEventListener('click', () => {
      navigator.clipboard.writeText('EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0');
      alert('آدرس ولت با موفقیت کپی شد!');
    });

    // نمایش موجودی در هنگام لود
    updateUI();

    // اتصال TON Connect
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://kandoo110.github.io/wlf-game/tonconnect-manifest.json',
      buttonRootId: 'ton-connect-button'
    });
  </script>
</body>
</html>
