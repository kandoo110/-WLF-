
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLF Secure Checkout</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- کتابخانه رسمی TonConnect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0b0e14);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }

        /* فریم جذاب با ترکیب ظریف و در هم رفته زرد و آبی (الهام از رنگ‌های پرچم) */
        .card {
            background: linear-gradient(135deg, rgba(0, 87, 183, 0.25) 0%, rgba(15, 20, 28, 0.95) 50%, rgba(255, 215, 0, 0.15) 100%);
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #0057b7, #ffd700) 1;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 87, 183, 0.3), 0 0 20px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(15px);
            box-sizing: border-box;
            background-clip: padding-box;
            position: relative;
        }

        /* حاشیه گرد نئونی زرد و آبی */
        .card-wrapper {
            background: linear-gradient(135deg, #0057b7, #ffd700);
            padding: 2px;
            border-radius: 26px;
            width: 100%;
            max-width: 384px;
            box-shadow: 0 12px 35px rgba(0, 87, 183, 0.4), 0 0 25px rgba(255, 215, 0, 0.25);
        }

        h2 { 
            color: #ffd700; 
            margin-bottom: 4px; 
            font-size: 22px; 
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        p { font-size: 13px; opacity: 0.85; margin-top: 2px; margin-bottom: 12px; }

        .price-tag {
            font-size: 26px;
            font-weight: 800;
            margin: 10px 0 15px 0;
            color: #2ed573;
            text-shadow: 0 0 15px rgba(46, 213, 115, 0.4);
        }

        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin: 12px 0;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #e1b12c);
            color: #0c1017;
            border: none;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        .btn:active { transform: scale(0.97); }

        .btn-dedust {
            background: linear-gradient(135deg, #0088cc, #0057b7);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: none;
        }

        .info-box {
            background: linear-gradient(135deg, rgba(0, 87, 183, 0.2), rgba(255, 215, 0, 0.08));
            border: 1px solid rgba(255, 215, 0, 0.35);
            color: #e0e6ed;
            padding: 14px;
            border-radius: 16px;
            font-size: 13px;
            margin-top: 15px;
            text-align: left;
            line-height: 1.5;
        }

        .info-box b { color: #ffd700; }
        .info-title { color: #ffd700; font-weight: bold; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="card" id="app">
            <h2>🪙 WLF Token Checkout</h2>
            <p id="game-title">Secure & Instant Game Unlock</p>
            
            <!-- قیمت بازی -->
            <div class="price-tag" id="price-display">499 WLF Tokens</div>
            
            <!-- گزینه اتصال ولت (همان اول دیده می‌شود) -->
            <div id="ton-connect-button"></div>

            <!-- پیام موجودی و تمامی گزینه‌ها (خرید از DeDust و استخراج) در همان ابتدا -->
            <div id="error-container" class="info-box">
                <span class="info-title">💡 Insufficient WLF Balance!</span>
                You need <span id="cost-text">499</span> WLF tokens in your connected wallet.<br><br>
                ✨ <b>Exclusive Ways to Get WLF:</b>
                <button class="btn btn-dedust" style="margin-top:10px;" onclick="window.open('https://dedust.io/swap/EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0/DUST', '_blank')">🛒 Buy Instantly on DeDust</button>
                <button class="btn btn-secondary" style="margin-top:8px;" onclick="showBotNotice()">⛏️ Free Mining & Rewards</button>
            </div>

            <!-- دکمه پرداخت نهایی (پس از دارا بودن موجودی) -->
            <div id="action-section" style="display: none;">
                <button class="btn" onclick="sendWlfPayment()">⚡ Pay 499 WLF & Unlock</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('game') || 'game';
        const cost = urlParams.get('cost') || '499';

        document.getElementById('price-display').innerText = cost + " WLF Tokens";
        document.getElementById('cost-text').innerText = cost;

        // راه‌اندازی TonConnect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://wlf-p1zk.onrender.com/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // مدیریت وضعیت اتصال ولت
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                // اگر ولت متصل شد و شارژ بود دکمه پرداخت روشن می‌شود
                document.getElementById('action-section').style.display = 'block';
                document.getElementById('error-container').style.display = 'none';
            } else {
                document.getElementById('action-section').style.display = 'none';
                document.getElementById('error-container').style.display = 'block';
            }
        });

        // تابع ارسال تراکنش کسر توکن
        async function sendWlfPayment() {
            const recipientAddress = "EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0"; 
            
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [
                    {
                        address: recipientAddress,
                        amount: "50000000" // کارمزد گاز شبکه TON
                    }
                ]
            };

            try {
                const result = await tonConnectUI.sendTransaction(transaction);
                alert("Payment successful! Unlocking your game...");
            } catch (e) {
                console.error(e);
                alert("Transaction cancelled or insufficient balance.");
            }
        }

        // پیام راهنمای بخش استخراج در منوی اصلی
        function showBotNotice() {
            alert("✨ This option is already available right inside the main bot menu! Simply close this window to check it out.");
        }
    </script>
</body>
</html>
