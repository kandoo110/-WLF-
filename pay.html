<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLF Secure Checkout</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- کتابخانه رسمی TonConnect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0e1621);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }
        /* فریم شکیل با ترکیب رنگ‌های آبی و زرد (پرچمی) و افکت نئونی */
        .card {
            background: linear-gradient(145deg, rgba(13, 37, 63, 0.95), rgba(18, 22, 25, 0.98));
            border: 2px solid #0057b7; /* حاشیه آبی پرچم */
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 25px rgba(0, 87, 183, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            position: relative;
        }
        /* نوار تزئینی زرد رنگ در بالای فریم برای تکمیل ترکیب زرد و آبی */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 4px;
            background: #ffd700; /* زرد طلایی پرچم */
            border-radius: 0 0 4px 4px;
            box-shadow: 0 0 10px #ffd700;
        }
        h2 { color: #ffd700; margin-bottom: 6px; font-size: 22px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        p { font-size: 13px; opacity: 0.85; line-height: 1.4; }
        .price-tag {
            font-size: 24px;
            font-weight: 800;
            margin: 12px 0;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin: 12px 0 8px 0;
        }
        .btn {
            background: linear-gradient(135deg, #ffd700, #e1b12c);
            color: #0e1621;
            border: none;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:active { transform: scale(0.97); }
        .btn-dedust {
            background: linear-gradient(135deg, #0057b7, #0088cc); /* آبی خوش‌رنگ صرافی و پرچم */
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 87, 183, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: none;
        }
        .info-box {
            background: linear-gradient(135deg, rgba(0, 87, 183, 0.15), rgba(255, 215, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.35);
            color: #e0e0e0;
            padding: 12px;
            border-radius: 14px;
            font-size: 12px;
            margin-top: 10px;
            text-align: left;
            line-height: 1.5;
        }
        .info-box b { color: #ffd700; }
    </style>
</head>
<body>

    <div class="card" id="app">
        <h2>🪙 WLF Token Checkout</h2>
        <p id="game-title">Secure & Instant Game Unlock</p>
        
        <!-- قیمت بازی -->
        <div class="price-tag" id="price-display">499 WLF</div>
        
        <!-- دکمه اتصال ولت در همان نمای اول -->
        <div id="ton-connect-button"></div>

        <!-- کادر یکپارچه پیام موجودی و گزینه‌ها داخل فریم آبی و زرد -->
        <div id="error-container" class="info-box">
            💡 <b>Boost Your WLF Balance!</b><br>
            You need <span id="cost-text">499</span> WLF, but your wallet balance is 0 WLF.<br><br>
            ✨ <b>Exclusive Ways to Get WLF:</b>
            <button class="btn btn-dedust" style="margin-top:8px;" onclick="window.open('https://dedust.io/swap/EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0/DUST', '_blank')">🛒 Buy Instantly on DeDust</button>
            <button class="btn btn-secondary" style="margin-top:6px;" onclick="showBotNotice()">⛏️ Free Mining & Rewards</button>
        </div>

        <!-- دکمه پرداخت نهایی -->
        <div id="action-section" style="display: none;">
            <button class="btn" onclick="sendWlfPayment()">⚡ Pay 499 WLF & Unlock</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('game') || 'game';
        const cost = urlParams.get('cost') || '499';

        document.getElementById('price-display').innerText = cost + " WLF Tokens";
        document.getElementById('cost-text').innerText = cost;

        // تنظیمات TonConnect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://wlf-p1zk.onrender.com/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // مدیریت وضعیت اتصال ولت
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                document.getElementById('action-section').style.display = 'block';
                document.getElementById('error-container').style.display = 'none';
            } else {
                document.getElementById('action-section').style.display = 'none';
                document.getElementById('error-container').style.display = 'block';
            }
        });

        // تابع ارسال تراکنش
        async function sendWlfPayment() {
            const recipientAddress = "EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0"; 
            
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [
                    {
                        address: recipientAddress,
                        amount: "50000000" // هزینه گاز شبکه
                    }
                ]
            };

            try {
                const result = await tonConnectUI.sendTransaction(transaction);
                alert("Payment successful! Unlocking your game...");
            } catch (e) {
                console.error(e);
                alert("Transaction cancelled or insufficient balance.");
            }
        }

        function showBotNotice() {
            alert("✨ This option is already available right inside the main bot menu! Simply close this window to check it out.");
        }
    </script>
</body>
</html>
