<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLF Secure Checkout</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- کتابخانه رسمی TonConnect UI برای اتصال به ولت‌های TON -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121619);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }
        .card {
            background: linear-gradient(145deg, rgba(30, 39, 46, 0.9), rgba(18, 22, 25, 0.95));
            border: 1px solid rgba(243, 186, 47, 0.2);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
        }
        h2 { color: #f3ba2f; margin-bottom: 8px; font-size: 22px; }
        p { font-size: 14px; opacity: 0.85; line-height: 1.5; }
        .price-tag {
            font-size: 24px;
            font-weight: 800;
            margin: 15px 0;
            color: #2ed573;
            text-shadow: 0 0 15px rgba(46, 213, 115, 0.3);
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        .btn {
            background: linear-gradient(135deg, #f3ba2f, #e1b12c);
            color: #121619;
            border: none;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3);
        }
        .btn:active { transform: scale(0.97); }
        .btn-dedust {
            background: linear-gradient(135deg, #0098ea, #0077b5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 152, 234, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        .info-box {
            background: linear-gradient(135deg, rgba(0, 152, 234, 0.1), rgba(243, 186, 47, 0.05));
            border: 1px solid rgba(0, 152, 234, 0.3);
            color: #dcdde1;
            padding: 14px;
            border-radius: 16px;
            font-size: 13px;
            margin-top: 15px;
            text-align: left;
            line-height: 1.6;
        }
        .info-box b { color: #f3ba2f; }
    </style>
</head>
<body>

    <div class="card" id="app">
        <h2>🪙 WLF Token Checkout</h2>
        <p id="game-title">Secure & Instant Game Unlock</p>
        
        <div class="price-tag" id="price-display">499 WLF</div>
        
        <!-- جایگاه استاندارد دکمه اتصال ولت (TonConnect) -->
        <div id="ton-connect-button"></div>

        <div id="action-section" style="display: none;">
            <button class="btn" onclick="sendWlfPayment()">⚡ Pay 499 WLF & Unlock</button>
        </div>

        <div id="error-container" class="info-box" style="display: none;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('game') || 'game';
        const cost = urlParams.get('cost') || '499';

        document.getElementById('price-display').innerText = cost + " WLF Tokens";

        // راه‌اندازی TonConnect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://wlf-p1zk.onrender.com/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // گوش دادن به وضعیت اتصال ولت کاربر
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                // ولت متصل شد، دکمه پرداخت نهایی را نمایش بده
                document.getElementById('action-section').style.display = 'block';
                document.getElementById('error-container').style.display = 'none';
            } else {
                // ولت متصل نیست
                document.getElementById('action-section').style.display = 'none';
            }
        });

        // تابع ارسال تراکنش انتقال توکن روی بلاکچین
        async function sendWlfPayment() {
            // آدرس ولت پروژه شما (که توکن‌ها باید به آن واریز شوند)
            const recipientAddress = "EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0"; 
            
            // تبدیل مقدار توکن به واحدهای نانو (در نظر گرفتن اعشار توکن)
            // به طور پیش‌فرض اگر توکن ۹ رقم اعشار داشته باشد: مقدار * 10^9
            const tokenAmountNano = (parseInt(cost) * 1000000000).toString();

            // ساخت بارهای تراکنش برای شبکه TON (Jetton Transfer Payload)
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600, // انقضا تا ۱۰ دقیقه دیگر
                messages: [
                    {
                        address: recipientAddress,
                        amount: "50000000", // کارمزد شبکه (معادل 0.05 تون برای هزینه گاز تراکنش)
                        // پیلود انتقال جتتون توکن WLF در اینجا قرار می‌گیرد
                    }
                ]
            };

            try {
                // ارسال درخواست امضای تراکنش به کیف پول کاربر (مثل Tonkeeper)
                const result = await tonConnectUI.sendTransaction(transaction);
                alert("Payment successful! Unlocking your game...");
                // در اینجا می‌توانید درخواست باز شدن بازی را به سرور ارسال کنید
            } catch (e) {
                console.error(e);
                // اگر کاربر موجودی کافی نداشت یا تراکنش را رد کرد:
                showInsufficientBalanceError();
            }
        }

        function showInsufficientBalanceError() {
            const errBox = document.getElementById('error-container');
            errBox.style.display = 'block';
            errBox.innerHTML = `
                💡 <b>Insufficient WLF Balance!</b><br>
                You need ${cost} WLF tokens in your connected wallet.<br><br>
                ✨ <b>Exclusive Ways to Get WLF:</b>
                <button class="btn btn-dedust" style="margin-top:10px;" onclick="window.open('https://dedust.io/swap/EQAUEpGOGqbJy-UIxQ6qblhqAROxgDuiMeB17zImB90n6st0/DUST', '_blank')">🛒 Buy Instantly on DeDust</button>
                <button class="btn btn-secondary" style="margin-top:8px;" onclick="showBotNotice()">⛏️ Free Mining & Rewards</button>
            `;
            document.getElementById('action-section').style.display = 'none';
        }

        function showBotNotice() {
            alert("✨ This option is already available right inside the main bot menu! Simply close this window to check it out.");
        }
    </script>
</body>
</html>
